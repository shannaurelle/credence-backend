[project]
name = "credence-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shannaurelle", email = "shannaurelleg@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-csp>=4.0",
    "djangorestframework>=3.18.3",
]

[project.scripts]
credence-backend = "credence_backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
]

[tool.uv.workspace]
members = [
    "credencev2",
]
